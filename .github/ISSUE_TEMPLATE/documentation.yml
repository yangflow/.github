name: Documentation
description: Something is missing, unclear or wrong in the docs
labels: ["documentation"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Link or path of the page or file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing, unclear or wrong
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
    validations:
      required: false
